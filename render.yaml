# Render Blueprint: deploys the API (Python) and the frontend (static site) from this repo.
# Dashboard: New > Blueprint > pick this repository. Fill the "sync: false" values when asked.
services:
  - type: web
    name: climate-hazard-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Migrate on every start (idempotent), then serve with gunicorn.
    # Analyses can take a while on first fetch, so the timeout is generous.
    startCommand: python manage.py migrate --noinput && gunicorn climate_api.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 180
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: ""
      - key: CORS_ALLOWED_ORIGINS
        sync: false            # the static site URL, e.g. https://climate-hazard-web.onrender.com
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: false            # TiDB Cloud / Aiven host
      - key: DB_PORT
        sync: false            # TiDB Cloud uses 4000
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL
        value: "1"

  - type: web
    name: climate-hazard-web
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE
        sync: false            # the API URL, e.g. https://climate-hazard-api.onrender.com
